<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Gestión de Docentes EPG{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS (CDN) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
        📚 EPG – Gestión Docentes
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarNav" aria-controls="navbarNav"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/' %}active{% endif %}"
              href="{{ url_for('index') }}">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if '/docentes' in request.path %}active{% endif %}"
              href="{{ url_for('docentes_list') }}">Docentes</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if '/programacion' in request.path %}active{% endif %}"
              href="{{ url_for('programacion') }}">Programación</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if '/periodos' in request.path %}active{% endif %}"
              href="{{ url_for('periodos_list') }}">Períodos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if '/cartas_invitacion' in request.path %}active{% endif %}"
              href="{{ url_for('cartas_invitacion') }}">Cartas invitación</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if '/programas' in request.path %}active{% endif %}"
              href="{{ url_for('programas_list') }}">
              Programas
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container mb-5">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
